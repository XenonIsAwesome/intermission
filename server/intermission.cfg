// The public intermission server: free-for-all deathmatch on Freedoom maps
// with monsters left in, so it never feels empty.

set sv_hostname "intermission"
set sv_motd "Claude is working. Rip and tear."
// Only people waiting on Claude, found through the mod, not public listings
set sv_usemasters 0
set sv_waddownload 0

set sv_gametype 1
set sv_skill 3
set sv_nomonsters 0
set sv_monstersrespawn 1
set sv_itemsrespawn 1
set sv_weaponstay 1
// A round lasts as long as Claude takes, so nobody should sit on the death
// screen working out that it wants a keypress
set sv_forcerespawn 1
set sv_forcerespawntime 3

// Equal limits, so everyone connected can always play. The mod spectates by
// itself between drop-ins, and a full server refuses the connection instead
// of leaving someone stuck watching.
set sv_maxclients 32
set sv_maxplayers 32

set sv_timelimit 10
addmap MAP01
addmap MAP02
addmap MAP03
addmap MAP04
addmap MAP05
addmap MAP06
